services:
  # Flask Backend Web Service
  - type: web
    name: aether-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:10000 --chdir backend run:app"
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aether-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*" # Recommended to restrict this to the Vercel app URL in production

databases:
  # Managed PostgreSQL instance
  - name: aether-db
    databaseName: inventatory
    user: inventatory_user
    plan: free
